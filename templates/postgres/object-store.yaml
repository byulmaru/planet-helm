apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: oci-object-storage
spec:
  configuration:
    destinationPath: s3://planet-postgres-backup/
    endpointURL: https://ax1l6f331yog.compat.objectstorage.ap-seoul-1.oraclecloud.com
    s3Credentials:
      accessKeyId:
        name: postgres-object-storage
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-object-storage
        key: SECRET_ACCESS_KEY
      region:
        name: postgres-object-storage
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
  retentionPolicy: 14d

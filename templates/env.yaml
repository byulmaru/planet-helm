apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: env
spec:
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 953a7c79-6486-44d6-a6be-04dd7eda1853
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: secret
        namespace: infisical

      secretsScope:
        projectId: 0e8afb24-b92a-439a-abd3-5fe9190e35b0
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: env
      secretNamespace: planet

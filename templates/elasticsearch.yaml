apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
spec:
  version: 8.11.3
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - name: default
      count: 1
      podTemplate:
        spec:
          initContainers:
            - name: install-plugins
              command:
                - sh
                - -c
                - |
                  bin/elasticsearch-plugin install --batch analysis-nori
          containers:
            - name: elasticsearch
              # env:
              #   - name: ES_JAVA_OPTS
              #     value: "-Xms4g -Xmx4g"
              resources:
                requests:
                  memory: "8Gi"
                  cpu: "200m"
                limits:
                  memory: "8Gi"
                  cpu: "200m"
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 20Gi
            storageClassName: oci-bv
